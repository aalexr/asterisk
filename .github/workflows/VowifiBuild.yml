name: VowifiBuild

# Build the vowifi branch for Linux x64 and Raspberry Pi.
#
# All builds run in Debian bookworm containers, the base of the current
# Raspberry Pi OS, so the Pi builds can be installed directly on a Pi:
#   linux-x64    Debian bookworm amd64, native runner
#   rpi-arm64    Debian bookworm arm64, native arm runner
#                (Raspberry Pi OS 64-bit, Pi 3/4/5/Zero 2 W)
#
# The tarballs are kept as workflow artifacts for 90 days. Pushes to a
# vowifi branch also publish them to a per-branch "build-<branch>"
# prerelease, which is replaced on every push and does not expire.

on:
  push:
    branches:
      - 'vowifi'
      - 'vowifi/**'
    paths-ignore:
      - 'doc/**'
      - '**.md'
  pull_request:
    branches:
      - 'vowifi'
      - 'vowifi/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: rpi-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    timeout-minutes: 90
    steps:
      # Without git in the container actions/checkout falls back to a plain
      # tarball and the version string ends up as UNKNOWN.
      - name: Install git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (without blobs) so make_version can git describe.
          fetch-depth: 0
          filter: blob:none

      - name: Build
        run: ./.github/scripts/vowifi-build.sh asterisk-${{ matrix.name }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-${{ matrix.name }}
          path: out/asterisk-${{ matrix.name }}.tar.gz
          retention-days: 90


  release:
    name: Publish release
    needs: native
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="build-$(echo "$BRANCH" | tr '/' '-')"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$BRANCH build" \
            --notes "Automatic build of \`$BRANCH\` at $GITHUB_SHA.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
