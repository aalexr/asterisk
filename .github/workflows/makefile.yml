name: Makefile CI

on:
  push:
    branches: [ "vowifi/20.7.0" ]
  pull_request:
    branches: [ "vowifi/20.7.0" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo contrib/scripts/install_prereq install

    - name: configure
      run: ./configure

    - name: Build
      run: make

    - name: Run check
      run: make check

    - name: Run distcheck
      run: make distcheck
